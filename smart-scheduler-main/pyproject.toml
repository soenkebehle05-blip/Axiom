[project]
name = "smart-scheduler"
version = "0.1.0"
description = "Voice-enabled scheduling agent that finds and books meeting times on Google Calendar"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.141,<1",
    "uvicorn>=0.54,<1",
    "websockets>=16,<17",
    "pydantic-settings>=2.15,<3",
    "python-dotenv>=1.2,<2",
    "httpx>=0.28,<1",
    "anthropic>=1.8,<2",
    "openai>=1.100,<4",
    "google-genai>=2.25,<3",
    "google-cloud-texttospeech>=2.37,<3",
    "google-api-python-client>=2.200,<3",
    "google-auth-httplib2>=0.4,<1",
    "google-auth-oauthlib>=1.4,<2",
]

[dependency-groups]
dev = [
    "ruff>=0.16,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = ["E", "F", "W", "Q", "A", "I", "B", "S", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Allow assert statements inside all files in the tests directory
"tests/**/*.py" = ["S101"]
