<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Axiom – KI Assistent</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app-container">
    <!-- Header / Statusleiste -->
    <header class="top-bar">
      <div class="brand">
        <h1>Axiom</h1>
      </div>
      <div class="status-pills">
        <span id="conn" class="pill warn">getrennt</span>
        <span id="calmode" class="pill clickable warn">Calendar: Nicht verbunden</span>
        <button id="clearchat" class="btn-secondary" title="Chatverlauf löschen">Chat löschen</button>
      </div>
    </header>

    <!-- Hauptbereich -->
    <main class="main-content">
      <!-- Chat & Transkript -->
      <section class="chat-section">
        <div id="transcript" class="transcript-container">
          <div class="msg bot">Sehr wohl, Sir. Wie kann ich Ihnen zu Diensten sein?</div>
        </div>
        
        <div id="interim" class="interim-text"></div>

        <!-- Eingabebereich -->
        <div class="input-area">
          <button id="mic" class="mic-btn" title="Spracheingabe starten/stoppen">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <path fill="currentColor" d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
              <path fill="currentColor" d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
            </svg>
          </button>

          <form id="textform" class="text-form">
            <input type="text" id="textin" placeholder="Schreiben Sie eine Nachricht an Axiom..." autocomplete="off" />
            <button type="submit" class="send-btn">Senden</button>
          </form>
        </div>

        <div class="options-bar">
          <label class="checkbox-label">
            <input type="checkbox" id="autolisten" />
            Automatisch zuhören nach Antwort
          </label>
        </div>
      </section>

      <!-- Seitenleiste für Notizen -->
      <aside class="sidebar">
        <div class="notes-panel">
          <div class="notes-header">
            <h2>Notizen & Aufgaben</h2>
            <button id="add-note-btn" class="btn-icon" title="Notiz hinzufügen">+</button>
          </div>

          <div id="notes-input-container" class="notes-input-box" hidden>
            <input type="text" id="new-note-input" placeholder="Neue Notiz eingeben & Enter drücken..." />
          </div>

          <ul id="notes-list" class="notes-list">
            <!-- Notizen werden dynamisch durch app.js eingefügt -->
          </ul>
        </div>
      </aside>
    </main>
  </div>

  <!-- Modal: Google Calendar Einstellungen & Upload -->
  <div id="calpanel" hidden class="modal">
    <div class="modal-content">
      <h3 id="calpanel-title">Google Calendar verbinden</h3>
      <p id="calpanel-current" hidden></p>
      <p id="calstatus" class="hint status"></p>
      
      <!-- Dateiupload-Button für token.json -->
      <div class="upload-section" style="margin: 15px 0;">
        <label for="calfile" class="btn-primary-outline" style="cursor: pointer; display: inline-block; padding: 8px 12px; border: 1px solid currentColor; border-radius: 4px;">
          📁 Token-Datei (.json) hochladen
        </label>
        <input type="file" id="calfile" accept=".json" style="display: none;" />
      </div>

      <div class="modal-actions">
        <button id="calsignin" class="btn-primary">Mit Google anmelden</button>
        <button id="caldisconnect" class="btn-danger" hidden>Konto trennen</button>
        <button id="calclose" class="btn-secondary">Schließen</button>
      </div>
    </div>
  </div>

  <!-- JS Skript einbinden -->
  <script src="/static/app.js"></script>
</body>
</html>
